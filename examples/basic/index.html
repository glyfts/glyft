<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glyft - Basic Example</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, sans-serif;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #eee;
      margin-bottom: 1rem;
      font-size: 1.5rem;
    }
    canvas {
      border: 2px solid #333;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      width: 640px;
      height: 480px;
    }
    .info {
      color: #888;
      margin-top: 1rem;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Glyft - Basic Example</h1>
    <canvas id="game" width="320" height="240"></canvas>
    <p class="info">Arrow keys to move</p>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
