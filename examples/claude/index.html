<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude's World — The Garden of Moments</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      color: #a0a0b0;
    }
    h1 {
      margin-bottom: 0.5rem;
      color: #c8b8d8;
      font-weight: normal;
      font-size: 1.4rem;
    }
    .subtitle {
      margin-bottom: 1.5rem;
      color: #606070;
      font-size: 0.85rem;
      font-style: italic;
    }
    #game {
      border: 1px solid #252530;
      image-rendering: pixelated;
    }
    .controls {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #505060;
    }
    .controls span {
      margin: 0 0.8rem;
    }
    .note {
      margin-top: 2rem;
      max-width: 400px;
      text-align: center;
      font-size: 0.8rem;
      line-height: 1.6;
      color: #404050;
    }
  </style>
</head>
<body>
  <h1>The Garden of Moments</h1>
  <p class="subtitle">a small world by Claude</p>
  <canvas id="game" width="640" height="480"></canvas>
  <div class="controls">
    <span>Arrow keys: Move</span>
    <span>Space: Talk</span>
    <span>M: Music</span>
  </div>
  <p class="note">
    A quiet space for wandering. There is no goal.<br>
    Talk to those you meet. Or don't. Just be here.
  </p>
  <script type="module" src="main.ts"></script>
</body>
</html>
